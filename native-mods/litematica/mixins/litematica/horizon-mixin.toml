[mod]
id = "litematica"
version = "1.1.1"
priority = 100

# The commit it was made on, the same one as the other bundles: they build together.
[compatibility]
horizon_revision = "07b7ea30d02973e7bc7579ea1e914dac2a9eca01"

# The .litematic format (NBT, packed block arrays), placements and materials.
[[crate]]
id = "schematic"
path = "schematic"

# Loading, placing, checking, the overlay, keys, commands and the status.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "litematica"
source = "runtime.rs"

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "keys"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_key"
helper = "keys.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
id = "wheel"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_wheel"
helper = "wheel.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "steps", ty = "f32", value = "steps" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

[[injection]]
id = "commands"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_commands"
helper = "commands.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<&'static str>", value = "&mut *commands" },
]

[[injection]]
id = "command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "hud"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_hud"
helper = "hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "corners", ty = "&mut horizon_client::extras_hud::Corners", value = "&mut *corners" },
]

# The overlay, as outlines in the world.
[[injection]]
id = "visuals"
kind = "HEAD"
target = "horizon_client::game::native_visuals::Game<'_>::native_frame_visuals"
helper = "visuals.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "lines", ty = "&mut Vec<horizon_client::gizmos::Line>", value = "&mut *lines" },
]

[[injection]]
id = "frame"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_frame"
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# The menu (K): drawn on the Options screen's AI Agent page while it's open.
# Public, so the game crate reaches it as horizon_client::options_ui::litematica_menu.
[[module]]
id = "menu"
file = "crates/horizon-client-render/src/options_ui.rs"
name = "litematica_menu"
source = "menu.rs"
visibility = "pub"

[[injection]]
id = "menu_draw"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::options_ui::OptionsUi::draw"
helper = "menu_draw.rs"
bindings = [
  { name = "options", ty = "&mut crate::options_ui::OptionsUi", value = "&mut *self" },
  { name = "batch", ty = "&mut crate::hud::HudBatch", value = "&mut *batch" },
  { name = "atlas", ty = "&crate::hud::HudAtlas", value = "atlas" },
  { name = "cursor", ty = "(f32, f32)", value = "cursor" },
]

[[injection]]
id = "menu_click"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::options_ui::OptionsUi::click"
helper = "menu_click.rs"
bindings = [
  { name = "options", ty = "&mut crate::options_ui::OptionsUi", value = "&mut *self" },
  { name = "x", ty = "f32", value = "x" },
  { name = "y", ty = "f32", value = "y" },
  { name = "drag", ty = "bool", value = "drag" },
  { name = "right", ty = "bool", value = "right" },
]

[[injection]]
id = "menu_wheel"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::options_ui::OptionsUi::wheel"
helper = "menu_wheel.rs"
bindings = [
  { name = "options", ty = "&mut crate::options_ui::OptionsUi", value = "&mut *self" },
  { name = "amount", ty = "f32", value = "amount" },
]

[[injection]]
id = "menu_key"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::options_ui::OptionsUi::key"
helper = "menu_key.rs"
bindings = [
  { name = "options", ty = "&mut crate::options_ui::OptionsUi", value = "&mut *self" },
  { name = "key", ty = "winit::keyboard::KeyCode", value = "key" },
]

[[injection]]
id = "menu_type"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::options_ui::OptionsUi::type_text"
helper = "menu_type.rs"
bindings = [
  { name = "options", ty = "&mut crate::options_ui::OptionsUi", value = "&mut *self" },
  { name = "text", ty = "&str", value = "text" },
]
