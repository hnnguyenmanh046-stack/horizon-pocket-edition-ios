[mod]
id = "block_place_particles"
version = "0.1.1"
priority = 100

# The commit it was tested on.
[compatibility]
horizon_revision = "fad5407bf2b8394c8d96c778e20d6ad108867128"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "native_block_place_particles"
source = "runtime.rs"

# The mod's row in Options > Mods.
[[injection]]
id = "listed"
kind = "HEAD"
hook = "mods"
hook_version = 1
helper = "listed.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

# Hook point: a player placed a block (API 14). Server-side, so the particles are
# queued with `lan_send_particles`, the way `native_send_particles` queues them,
# for every player of the world.
[[injection]]
id = "place"
kind = "HEAD"
hook = "place_block"
hook_version = 1
helper = "place.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32;3]", value = "pos" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
]
