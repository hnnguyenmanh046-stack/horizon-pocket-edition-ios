[mod]
id = "item_physic_lite"
version = "0.1.0"
priority = 100

# The commit it was written against.
[compatibility]
horizon_revision = "54e4aec0af1064a6ce3b9f192c55e2c43952b061"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "native_item_physic_lite"
source = "runtime.rs"

# The mod's row in Options > Mods: the player turns it off there.
[[injection]]
id = "listed"
kind = "HEAD"
hook = "mods"
hook_version = 1
helper = "listed.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

# Every dropped item's drawing: replaced by the same drawing with the pose of
# Item Physic Lite (no bobbing, no spinning, flat items lying on the ground).
[[injection]]
id = "draw"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::item_draw::Game<'_>::dropped_item_geometry"
helper = "draw.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "camera", ty = "glam::DVec3", value = "camera" },
  { name = "alpha", ty = "f64", value = "alpha" },
  { name = "out", ty = "&mut Vec<Vertex>", value = "&mut *out" },
]
