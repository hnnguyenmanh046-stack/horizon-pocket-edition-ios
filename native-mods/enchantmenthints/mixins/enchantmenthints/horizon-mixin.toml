[mod]
id = "enchantmenthints"
version = "0.1.0"
# Nobody else hooks the tooltip; same-site HEAD hooks run by priority, highest
# first, and the first Break skips the rest.
priority = 100

# Pinned: the tooltip hook (marked below) targets a game function that is not
# a native hook point (game/native_hooks.rs has none for item tooltips), and
# native.rs reads the game's own internals (the enchantment registry, the
# Shift keys), so the mod is made for this one commit. Its other hooks use only
# hook points (NATIVE_HOOKS_API 1).
[compatibility]
horizon_revision = "142388e1c136e622652ec7505af15d8ad195e041"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "enchantmenthints"
source = "runtime.rs"

[[module]]
id = "native"
file = "crates/horizon-client/src/game.rs"
name = "enchantmenthints_native"
source = "native.rs"

# Horizon PE: the item tooltip's hook point (`native_tooltip`, asked for every
# item tooltip once its lines are built: a slot under the mouse or the virtual
# mouse, a slot picked by touch, the creative tabs, the recipe book, chat's
# show_item). The hints go in under its enchantment lines. The mod used to hook
# `stations::Game::stack_tooltip`, which this game calls only for a slot picked
# by touch, so a tooltip under the pointer had no hints.
[[injection]]
id = "tooltip"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tooltip"
helper = "tooltip.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "lines", ty = "&mut Vec<(horizon_client::text::Text, u32)>", value = "&mut *lines" },
]

# Hook points: the row in Options > Mods and its settings page.
[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]
