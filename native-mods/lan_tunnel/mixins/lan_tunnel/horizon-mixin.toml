[mod]
id = "lan_tunnel"
version = "0.1.0"
priority = 100

# The commit it was written against.
[compatibility]
horizon_revision = "54e4aec0af1064a6ce3b9f192c55e2c43952b061"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "native_lan_tunnel"
source = "runtime.rs"

# The mod's row in Options > Mods: the player turns it off there.
[[injection]]
id = "listed"
kind = "HEAD"
hook = "mods"
hook_version = 1
helper = "listed.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

# Every tick of the window's game: when the world is open to LAN, a tunnel
# opens, and its address is said in chat.
[[injection]]
id = "tick"
kind = "HEAD"
hook = "tick"
hook_version = 1
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]
