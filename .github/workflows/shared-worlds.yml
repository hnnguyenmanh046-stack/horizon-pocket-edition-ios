name: shared-worlds
# The shared worlds crate (crates/horizon-shared-worlds): its layout, its lints with warnings as
# errors, its tests, and the same flows against a real S3 API (MinIO, started here).
on:
  push:
    branches: [shared-worlds]
    paths:
      - .github/workflows/shared-worlds.yml
      - crates/horizon-shared-worlds/**
      - crates/horizon-friends/**
      - tools/ci/s3_server.sh
      - tools/ci/natlab.sh
      - tools/ci/stun_server.py
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-worlds-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never

jobs:
  crate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          bash tools/ci/rustup_install.sh --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: shared-worlds
          cache-on-failure: true
      # On a layout slip the patch that fixes it is kept (git apply), and the run goes on to the
      # lints and tests so one run reports everything.
      - name: Formatting
        id: format
        continue-on-error: true
        run: |
          cargo fmt -p horizon-shared-worlds
          git diff --exit-code > format.patch || { cat format.patch; exit 1; }
      - uses: actions/upload-artifact@v4
        if: steps.format.outcome == 'failure'
        with:
          name: format-patch
          path: format.patch
      - name: Put the tree back as it was pushed
        run: git checkout -- .
      - name: Lint
        if: ${{ !cancelled() }}
        run: cargo clippy --keep-going -p horizon-shared-worlds --all-targets -- -D warnings
      - name: Test
        if: ${{ !cancelled() }}
        run: cargo test -p horizon-shared-worlds
      # The two releases against each other, each built from its own source: 1.1.0 hosts on the
      # 0.9.0 engine, whose saves the 0.8.0 engine of 1.0.0 must not open and write back older.
      - name: 1.0.0 refuses a world this version saved, and this version reads 1.0.0's
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          old=$RUNNER_TEMP/v1.0.0
          git fetch --quiet --depth 1 origin tag v1.0.0-shared-worlds
          git worktree add --quiet --detach "$old" v1.0.0-shared-worlds
          cp crates/horizon-shared-worlds/examples/format_probe.rs "$old/crates/horizon-shared-worlds/examples/"
          probe() { cargo run --quiet -p horizon-shared-worlds --example format_probe -- "$@"; }
          old_probe() { (cd "$old" && CARGO_TARGET_DIR=$RUNNER_TEMP/v1.0.0-target probe "$@"); }
          probe write "$RUNNER_TEMP/saved-now"
          old_probe write "$RUNNER_TEMP/saved-1.0.0"
          old_probe read "$RUNNER_TEMP/saved-now" | tee "$RUNNER_TEMP/old-reads-new.txt"
          probe read "$RUNNER_TEMP/saved-1.0.0" | tee "$RUNNER_TEMP/new-reads-old.txt"
          probe read "$RUNNER_TEMP/saved-now" | tee "$RUNNER_TEMP/new-reads-new.txt"
          grep -qx "manifest: refused: unreadable record: this world was saved by a newer version of the game: update to play it" "$RUNNER_TEMP/old-reads-new.txt"
          grep -qx "lease: refused: unreadable record: this world was last hosted by a newer version of the game: update to play it" "$RUNNER_TEMP/old-reads-new.txt"
          for reads in new-reads-old new-reads-new; do
            grep -qx "manifest: read" "$RUNNER_TEMP/$reads.txt"
            grep -qx "lease: read" "$RUNNER_TEMP/$reads.txt"
          done
          git worktree remove --force "$old"
      - name: Start an S3 server
        if: ${{ !cancelled() }}
        run: bash tools/ci/s3_server.sh
      # The live tests pass without doing anything when no server is given: make sure one is.
      - name: Test against the S3 server
        if: ${{ !cancelled() }}
        run: |
          test -n "$SHARED_WORLDS_S3_ENDPOINT"
          cargo test -p horizon-shared-worlds --test s3_live -- --nocapture
      # The lockfile as cargo resolved it here, to commit when a dependency was added.
      - name: Keep the lockfile
        if: ${{ !cancelled() }}
        run: mkdir -p lock && cp Cargo.lock lock/
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: cargo-lock
          path: lock/Cargo.lock
      - name: The layout must be right too
        if: steps.format.outcome == 'failure'
        run: exit 1

  # A host and a guest behind simulated home routers (network namespaces) with a real bore
  # server and a STUN server between them: direct first, UDP only when TCP finds nothing, the
  # tunnel only when neither does (tools/ci/natlab.sh).
  natlab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          bash tools/ci/rustup_install.sh --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: natlab
          cache-on-failure: true
      - name: Build the lab's two ends and a bore server
        run: |
          cargo build --release -p horizon-shared-worlds --example natlab
          cargo install bore-cli --locked --root "$RUNNER_TEMP/bore"
      - name: The NAT lab
        run: sudo -E bash tools/ci/natlab.sh target/release/examples/natlab "$RUNNER_TEMP/bore/bin/bore"
