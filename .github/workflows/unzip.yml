name: Unzip native mods

on: 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          cd native-mods
          unzip -o mods.zip -d .
          rm mods.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add native-mods
          git commit -m "Extract native mods" || true
          git push
