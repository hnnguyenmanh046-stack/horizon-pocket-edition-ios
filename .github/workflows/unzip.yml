name: Unzip native mods

on:
  workflow_dispatch:
  push:
    paths:
      - 'native-mods/**/*.zip'
      - 'native-mods/*.zip'

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP files
        run: |
          find native-mods -type f -name "*.zip" | while read file; do
            folder="${file%.zip}"
            mkdir -p "$folder"
            unzip -o "$file" -d "$folder"
            rm "$file"
          done

      - name: Commit extracted files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add native-mods
          git diff --cached --quiet || git commit -m "Extract native mod ZIP files"
          git push
