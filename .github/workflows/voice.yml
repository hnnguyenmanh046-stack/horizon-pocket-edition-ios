name: voice
# Voice chat's own crate (crates/horizon-voice): its layout, its lints with warnings as errors and
# its tests on Linux, and that it builds (the Opus codec with it, C built by cmake) for everything
# the game is built for: an iPhone, the iOS simulator and Android.
on:
  push:
    branches: [shared-worlds]
    paths:
      - .github/workflows/voice.yml
      - crates/horizon-voice/**
      - crates/horizon-gamecontroller/**
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voice-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never

jobs:
  crate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: voice
          cache-on-failure: true
      # On a layout slip the patch that fixes it is kept (git apply), and the run goes on to the
      # lints and tests so one run reports everything.
      - name: Formatting
        id: format
        continue-on-error: true
        run: |
          cargo fmt -p horizon-voice
          git diff --exit-code > format.patch || { cat format.patch; exit 1; }
      - uses: actions/upload-artifact@v4
        if: steps.format.outcome == 'failure'
        with:
          name: format-patch
          path: format.patch
      - name: Put the tree back as it was pushed
        run: git checkout -- .
      - name: Lint
        if: ${{ !cancelled() }}
        run: cargo clippy --keep-going -p horizon-voice --all-targets -- -D warnings
      - name: Test
        if: ${{ !cancelled() }}
        run: cargo test -p horizon-voice
      # The lockfile as cargo resolved it here, to commit when a dependency was added.
      - name: Keep the lockfile
        if: ${{ !cancelled() }}
        run: mkdir -p lock && cp Cargo.lock lock/
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: cargo-lock
          path: lock/Cargo.lock
      - name: The layout must be right too
        if: steps.format.outcome == 'failure'
        run: exit 1

  # The codec is C: it must build for an iPhone and for the simulator ios.yml tests on.
  apple:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # As ios.yml: rustc and cc read it.
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and its iOS standard libraries
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-ios --target aarch64-apple-ios-sim
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: voice-apple
          cache-on-failure: true
      # With the iPhone's own audio code (horizon-gamecontroller's voice.rs), which nothing but an
      # Apple target compiles.
      - name: Build for an iPhone
        run: cargo build -p horizon-voice -p horizon-gamecontroller --target aarch64-apple-ios
      - name: Build for the simulator
        if: ${{ !cancelled() }}
        run: cargo build -p horizon-voice -p horizon-gamecontroller --target aarch64-apple-ios-sim
      # The host's own build runs the tests against the same C code Apple's compiler made.
      - name: Test on macOS
        if: ${{ !cancelled() }}
        run: cargo test -p horizon-voice

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the NDK Starling's APK pins
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Install Rust for Android and cargo-ndk
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-linux-android
          rustup default stable
          cargo install cargo-ndk --version 3.5.4 --locked
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: voice-android
          cache-on-failure: true
      - name: Build for Android
        run: cargo ndk -t arm64-v8a build -p horizon-voice
