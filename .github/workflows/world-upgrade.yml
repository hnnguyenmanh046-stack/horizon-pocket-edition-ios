name: world-upgrade
# A player's game folder through an update of the app (tools/world_upgrade.py): the release before
# makes a world, a player with items and some settings; this source's game is started in a copy
# of that whole folder and must find the world, its blocks, the player where they stood with what
# they had, and every setting as it was. Both games are built here for the desktop, each with the
# game files its own preparer makes.
on:
  workflow_dispatch:
    inputs:
      old:
        description: The release to upgrade from (a tag); empty for this edition's 1.0.0
        type: string
        default: ""
  # And when the test itself changes (branches only: a tag's push has no paths to go by).
  push:
    branches: ["**"]
    paths:
      - .github/workflows/world-upgrade.yml
      - tools/world_upgrade.py
      - tools/load_times.py
permissions:
  contents: read
concurrency:
  group: world-upgrade-${{ github.ref }}
  cancel-in-progress: true
env:
  HORIZON_TELEMETRY_URL: "off"
  HORIZON_LAUNCHER_NO_SELF_UPDATE: "1"
  HORIZON_NO_AUDIO: "1"
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_FAST_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Make room for two builds
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Which release this edition upgrades from
        id: old
        env:
          OLD: ${{ inputs.old }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$OLD" ]; then
            case "$BRANCH" in
              *shared-worlds-mods*) OLD=v1.0.0-shared-worlds-mods ;;
              *shared-worlds*) OLD=v1.0.0-shared-worlds ;;
              *) OLD=v1.0.0 ;;
            esac
          fi
          echo "$OLD" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-shared-worlds(-mods)?)?$' \
            || { echo "::error::$OLD is not a release tag"; exit 1; }
          echo "ref=$OLD" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          path: port
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.old.outputs.ref }}
          path: old
          persist-credentials: false
      - name: Install what the games link against, a virtual screen and a software GPU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libfontconfig-dev libvulkan-dev libasound2-dev libudev-dev xvfb xauth mesa-vulkan-drivers libvulkan1
          bash port/tools/ci/rustup_install.sh --profile minimal
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            port
            old
          shared-key: world-upgrade
          cache-on-failure: true
      - uses: actions/cache@v4
        with:
          path: minecraft
          key: world-upgrade-minecraft-${{ hashFiles('port/research-lock.json') }}
      - name: Download the pinned official game files
        run: |
          set -euo pipefail
          python3 - "$PWD/minecraft" > server-jar.txt <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'port/tools')
          import ios_prepare
          import lab
          print(ios_prepare.download_game(lab.pinned_version(), Path(sys.argv[1]).resolve()))
          PY
          tail -n 1 server-jar.txt
      - name: Prepare the game files with each engine's own preparer
        run: |
          set -euo pipefail
          server=$(tail -n 1 server-jar.txt)
          for tree in port old; do
            export HORIZON_HOME="$RUNNER_TEMP/prepare-$tree/home" HORIZON_LAUNCHER_HOME="$RUNNER_TEMP/prepare-$tree/launcher"
            export XDG_DATA_HOME="$RUNNER_TEMP/prepare-$tree/data" XDG_CONFIG_HOME="$RUNNER_TEMP/prepare-$tree/config"
            (cd "$tree" && cargo run --release -p horizon-prepare -- --root "$PWD" --prepare --complete \
              --minecraft-dir "$GITHUB_WORKSPACE/minecraft" --server-jar "$server" --java-home "$JAVA_HOME" \
              --output "$GITHUB_WORKSPACE/resources-$tree")
            ls "$GITHUB_WORKSPACE/resources-$tree" | head -20
          done
      - name: Build this source's game for the desktop
        working-directory: port
        run: cargo build --profile fast -p horizon-game --bin horizon-client
      # 1.0.0's game is horizon-client's own program (Starling 0.8.0's layout).
      - name: Build the release before
        working-directory: old
        run: |
          if grep -q '^name = "horizon-game"' crates/horizon-game/Cargo.toml 2>/dev/null; then
            cargo build --profile fast -p horizon-game --bin horizon-client
          else
            cargo build --profile fast -p horizon-client --bin horizon-client
          fi
      - name: The release before plays; this source's game opens its folder
        run: |
          python3 port/tools/world_upgrade.py --xvfb --offscreen \
            --old-client old/target/fast/horizon-client --old-resources resources-old \
            --new-client port/target/fast/horizon-client --new-resources resources-port
      # Horizon PE: and neither build may be slower to load than the release before
      # (tools/load_times.py): start to title, and opening a saved world, by turns.
      - name: This source loads as fast as the release before
        run: |
          python3 port/tools/load_times.py --xvfb --offscreen \
            --old-client old/target/fast/horizon-client --old-resources resources-old \
            --new-client port/target/fast/horizon-client --new-resources resources-port
