name: native-mods-check
# Every native mod there is for this game (the registry's, and native-mods/'s own), each applied to
# this source alone and compiled for the desktop, as ios.yml builds an iPhone's with mods: a mod
# that no longer applies or compiles is found here, every one in one run, before anyone asks the app
# for a build with it. The report (the summary, and the native-mods-report artifact) names each
# failing mod with its first errors.
on:
  # Whenever what adapts and applies the mods changes, and on demand.
  push:
    paths:
      - .github/workflows/native-mods-check.yml
      - packaging/android/native_mod_adapt.py
      - packaging/ios/native_stage.sh
      - packaging/ios/native_stage_cfg.py
      - tools/ios_native_mods.py
  workflow_dispatch:
    inputs:
      mods:
        description: "Only these mods (ids, spaces or commas); every one when empty"
        required: false
permissions:
  contents: read
  # The kept horizon-mixins (native-tool-keep) is a build file of another run.
  actions: read
concurrency:
  group: native-mods-check-${{ github.ref }}
  cancel-in-progress: true
env:
  HORIZON_TELEMETRY_URL: "off"
  CARGO_TERM_COLOR: never

jobs:
  # The mods, and a warm cache of the unmodified source (and horizon-mixins) for every check.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      mods: ${{ steps.list.outputs.mods }}
    steps:
      - uses: actions/checkout@v4
      - name: The mods
        id: list
        env:
          ONLY: ${{ inputs.mods }}
        run: |
          set -euo pipefail
          # Without the registry, native-mods/ is all there is to check.
          curl -fsSL --retry 3 https://horizon-rust.github.io/horizon-mods/index.json -o "$RUNNER_TEMP/index.json" \
            || cp packaging/ios/registry/index.json "$RUNNER_TEMP/index.json"
          python3 tools/ios_native_mods.py list "$RUNNER_TEMP/index.json" | cut -f1 > "$RUNNER_TEMP/all.txt"
          python3 - "$RUNNER_TEMP/all.txt" "$ONLY" >> "$GITHUB_OUTPUT" <<'EOF'
          import json, re, sys
          every = [l.strip() for l in open(sys.argv[1]) if l.strip()]
          only = [m for m in re.split(r"[\s,]+", sys.argv[2]) if m]
          chosen = [m for m in every if not only or m in only]
          missing = [m for m in only if m not in every]
          if missing:
              sys.exit(f"not native mods for this game: {missing}")
          print("mods=" + json.dumps(chosen))
          EOF
          echo "$(wc -l < "$RUNNER_TEMP/all.txt") native mods"
      - name: Install Rust and the ALSA and udev headers the client links against
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          bash tools/ci/rustup_install.sh --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-mods-check
          cache-on-failure: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/starling-native
          key: native-mixins-${{ runner.os }}-${{ hashFiles('packaging/android/native_build.sh') }}
      - name: The kept tool, when the cache has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rev=$(sed -n 's/^MIXINS_REV=\([0-9a-f]\{40\}\)$/\1/p' packaging/android/native_build.sh)
          tool=$HOME/.cache/starling-native/mixins-${rev:0:12}/bin/horizon-mixins
          if [ -x "$tool" ]; then
            echo "horizon-mixins is in the cache"
            exit 0
          fi
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=horizon-mixins-kept&per_page=20" \
            --jq '[.artifacts[] | select(.expired | not)][0].workflow_run.id // empty')
          if [ -n "$run" ]; then
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name horizon-mixins-kept --dir "$RUNNER_TEMP/kept"
            mkdir -p "$HOME/.cache"
            tar -C "$HOME/.cache" -xzf "$RUNNER_TEMP/kept/starling-native-linux-x64.tar.gz"
          fi
          if [ -x "$tool" ]; then
            echo "::notice::horizon-mixins ${rev:0:12} taken from what native-tool-keep kept"
          else
            echo "::warning::no kept horizon-mixins ${rev:0:12}: it is built from Horizon's repository"
          fi
      - name: horizon-mixins, and the source as it is
        run: |
          set -euo pipefail
          rev=$(sed -n 's/^MIXINS_REV=\([0-9a-f]\{40\}\)$/\1/p' packaging/android/native_build.sh)
          tools=$HOME/.cache/starling-native/mixins-${rev:0:12}
          [ -x "$tools/bin/horizon-mixins" ] || cargo install --locked --git https://github.com/horizon-rust/horizon-mixins --rev "$rev" --root "$tools" horizon-mixins-cli
          cargo check -p horizon-client --lib

  check:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        mod: ${{ fromJson(needs.prepare.outputs.mods) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and the ALSA and udev headers the client links against
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          bash tools/ci/rustup_install.sh --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-mods-check
          save-if: false
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/starling-native
          key: native-mixins-${{ runner.os }}-${{ hashFiles('packaging/android/native_build.sh') }}
      - name: Apply and compile ${{ matrix.mod }}
        id: check
        env:
          MOD: ${{ matrix.mod }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          result() { echo "$1" > "$RUNNER_TEMP/out/$MOD.result"; }
          # Without the registry, native-mods/ is all there is to check.
          curl -fsSL --retry 3 https://horizon-rust.github.io/horizon-mods/index.json -o "$RUNNER_TEMP/index.json" \
            || cp packaging/ios/registry/index.json "$RUNNER_TEMP/index.json"
          if ! python3 tools/ios_native_mods.py fetch "$RUNNER_TEMP/index.json" "$RUNNER_TEMP/native" "$MOD" > "$RUNNER_TEMP/out/$MOD.fetch.log" 2>&1; then
            result fetch; cat "$RUNNER_TEMP/out/$MOD.fetch.log"; exit 1
          fi
          if ! bash packaging/ios/native_stage.sh . "$RUNNER_TEMP/native/bundles" > "$RUNNER_TEMP/out/$MOD.stage.log" 2>&1; then
            result apply; tail -60 "$RUNNER_TEMP/out/$MOD.stage.log"; exit 1
          fi
          # The compiler's whole messages: the staged source is not the mod's own files, and the
          # code each error shows is how it is found in them.
          if ! cargo check --keep-going -p horizon-client --lib > "$RUNNER_TEMP/out/$MOD.check.log" 2>&1; then
            result compile; grep -E '^(error|warning: unused)' -A0 "$RUNNER_TEMP/out/$MOD.check.log" | head -60; exit 1
          fi
          result ok
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: native-check-${{ matrix.mod }}
          path: ${{ runner.temp }}/out/
          retention-days: 7

  report:
    needs: [prepare, check]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-check-*
          merge-multiple: true
          path: out
      - name: The report
        env:
          MODS: ${{ needs.prepare.outputs.mods }}
        run: |
          python3 - out "$MODS" > report.md <<'EOF'
          import json, pathlib, re, sys
          out, mods = pathlib.Path(sys.argv[1]), json.loads(sys.argv[2])
          rows, bad = [], []
          for mod in mods:
              r = out / f"{mod}.result"
              result = r.read_text().strip() if r.exists() else "no result"
              if result == "ok":
                  continue
              bad.append(mod)
              log = {"fetch": "fetch", "apply": "stage", "compile": "check"}.get(result, "check")
              text = (out / f"{mod}.{log}.log").read_text(errors="replace") if (out / f"{mod}.{log}.log").exists() else ""
              if result == "compile":
                  every = text.splitlines()
                  lines = []
                  for i, l in enumerate(every):
                      if re.match(r"^error(\[E\d+\])?: ", l) and "could not compile" not in l:
                          where = next((w.strip() for w in every[i + 1 : i + 4] if w.strip().startswith("-->")), "")
                          lines.append(f"{l} {where}".strip())
                  lines = lines[:12]
              else:
                  lines = text.strip().splitlines()[-8:]
              rows.append(f"### {mod}: {result}\n```\n" + "\n".join(lines) + "\n```")
          print(f"# Native mods: {len(mods) - len(bad)} of {len(mods)} apply and compile\n")
          print("Failing: " + (", ".join(bad) or "none") + "\n")
          print("\n\n".join(rows))
          EOF
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          cat report.md
      - uses: actions/upload-artifact@v4
        with:
          name: native-mods-report
          path: report.md
