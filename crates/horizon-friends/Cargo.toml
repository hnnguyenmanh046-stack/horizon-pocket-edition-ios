[package]
name = "horizon-friends"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Play with friends: invite codes, the relay protocol, the end-to-end encrypted tunnel between a host's integrated server and its guests"

[dependencies]
# The key exchange keyed by the code's secret, then the frames.
spake2 = { version = "0.4", features = ["getrandom"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
getrandom = "0.3"
# SO_REUSEADDR/SO_REUSEPORT for the direct socket (TCP simultaneous open).
socket2 = { version = "0.5", features = ["all"] }
# This machine's addresses (LAN, VPNs such as Tailscale or ZeroTier, IPv6) for the code.
if-addrs = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
# The UDP step (src/udp.rs), only when TCP found no direct way: QUIC over the punched sockets,
# TLS 1.3 on ring with a certificate made per session (rustls, ring and rcgen are already in
# the lockfile through ureq and the server), on a one-thread tokio runtime of its own.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "time", "macros"] }

[lints]
workspace = true
